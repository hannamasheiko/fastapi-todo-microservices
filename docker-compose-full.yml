services:
  postgres:
    image: postgres:15
    container_name: todo-postgres
    environment:
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: todo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  analytics_postgres:
    image: postgres:15
    container_name: analytics-postgres
    environment:
      POSTGRES_USER: analytics_user
      POSTGRES_PASSWORD: analytics_password_123
      POSTGRES_DB: analytics_db
    ports:
      - "5433:5432"
    volumes:
      - analytics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_user"]
      interval: 10s
      timeout: 5s
      retries: 5
  notification_postgres:
    image: postgres:15
    container_name: notification-postgres
    environment:
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_password_123
      POSTGRES_DB: notification_db
    ports:
      - "5434:5432"
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U notification_user -d notification_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: todo-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: todo-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  todo_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://todo_user:secure_password_123@postgres:5432/todo_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      DEBUG: "True"
      ANALYTICS_SERVICE_URL: http://analytics_service:8000
      NOTIFICATION_SERVICE_URL: http://notification_service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: uvicorn todo_service.app.main:app --host 0.0.0.0 --port 8000

  notification_service:
    build:
      context: .
      dockerfile: notification_service/Dockerfile
    container_name: notification-api
    ports:
      - "8002:8000"
    environment:
      NOTIFICATION_DATABASE_URL: postgresql+asyncpg://notification_user:notification_password_123@notification_postgres:5432/notification_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      DEBUG: "True"
    depends_on:
      notification_postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: uvicorn notification_service.app.main:app --host 0.0.0.0 --port 8000

  analytics_service:
    build:
      context: .
      dockerfile: analytics_service/Dockerfile
    container_name: analytics-api
    ports:
      - "8001:8000"
    environment:
      ANALYTICS_DATABASE_URL: postgresql+asyncpg://analytics_user:analytics_password_123@analytics_postgres:5432/analytics_db
      DEBUG: "True"
    depends_on:
      analytics_postgres:
        condition: service_healthy
    command: uvicorn analytics_service.app.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
  analytics_postgres_data:
  notification_postgres_data:
  redis_data: